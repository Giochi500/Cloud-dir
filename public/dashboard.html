<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            width: 100%;
            margin: 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            text-align: center;
            flex: 1;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .user-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .user-details {
            text-align: right;
            font-size: 14px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .controls {
            display: flex;
            gap: 20px;
            padding: 20px 30px;
            background: #f8f9fa;
            flex-wrap: wrap;
            align-items: center;
        }

        .month-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            padding: 20px 30px;
            max-height: 70vh;
            position: relative;
        }

        .table-container::-webkit-scrollbar {
            height: 10px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        tr:hover {
            background: #f8f9fa;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .editable {
            background: #fff3cd;
            padding: 8px 12px;
            border: 1px solid #ffc107;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .editable:hover {
            background: #ffe69c;
            border-color: #ff9800;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #667eea;
            border-radius: 4px;
            font-size: 0.95em;
        }

        .btn-save {
            background: #28a745;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-save:hover {
            background: #218838;
        }

        .btn-cancel {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 30px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 30px;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>💰 Salary Management System</h1>
                <p>Manage employee salaries efficiently</p>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <div id="userName">Loading...</div>
                    <div id="userRole" style="font-size: 12px; opacity: 0.8;"></div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="controls">
            <div class="month-selector">
                <label for="monthSelect">Select Month:</label>
                <select id="monthSelect">
                    <option value="">Loading months...</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="searchInput" placeholder="Search all columns..." style="padding: 10px 15px; border: 2px solid #667eea; border-radius: 5px; width: 250px;">
                <button id="searchBtn" style="padding: 10px 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;">Search</button>
                <button id="addEmployeeBtn" onclick="openAddEmployeeModal()" style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;">➕ Add Employee</button>
                <button id="clearFilters" style="padding: 10px 15px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;">Clear All</button>
            </div>
        </div>

        <div id="message"></div>
        <div id="content" class="table-container">
            <div class="loading">Loading data...</div>
        </div>

        <footer>
            <p>Salary API v1.0 | Last updated: <span id="timestamp">--</span></p>
        </footer>
    </div>

    <!-- Add Employee Modal -->
    <div id="addEmployeeModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
            <h2 style="margin-bottom: 20px; color: #333;">➕ Add New Employee</h2>
            <form id="addEmployeeForm">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #333;">სახელი გვარი (Full Name)</label>
                    <input type="text" id="empName" placeholder="Employee full name" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em;" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #333;">პირადი ნომერი (Personal ID - 11 digits)</label>
                    <input type="text" id="empPersonalId" placeholder="e.g., 01001058679" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em;" maxlength="11" required>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #333;">თანამდებობა (Position)</label>
                    <select id="empPosition" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em;" required>
                        <option value="">Select position</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #333;">სამუშაო ადგილი (Work Location)</label>
                    <select id="empLocation" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em;" required>
                        <option value="">Select work location</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #333;">დეპარტამენტი (Department)</label>
                    <select id="empDepartment" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em;" required>
                        <option value="">Select department</option>
                    </select>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #333;">ხელშეკრულების ტიპი (Contract Type)</label>
                    <select id="empContractType" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em;" required>
                        <option value="">Select contract type</option>
                        <option value="სახელფასო">სახელფასო (Salary)</option>
                        <option value="მომსახურება">მომსახურება (Service)</option>
                    </select>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #333;">ხელფასი NET (Net Salary) <span style="color: #999;">(Optional)</span></label>
                    <input type="number" id="empSalary" placeholder="0" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em;">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 1; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em;">Save Employee</button>
                    <button type="button" onclick="closeAddEmployeeModal()" style="flex: 1; padding: 12px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let currentMonth = null;
        let currentData = [];
        let originalData = [];
        let activeFilters = {};
        let editingCell = null;

        // Get token from localStorage
        function getToken() {
            return localStorage.getItem('token');
        }

        // Make authenticated API call
        async function apiCall(url, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getToken()}`,
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        }

        // Load user info
        async function loadUserInfo() {
            try {
                const res = await fetch(`${API_URL}/user`);
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('userName').textContent = `${data.user.username}`;
                    document.getElementById('userRole').textContent = `Role: ${data.user.role}`;
                }
            } catch (err) {
                console.error('Error loading user info:', err);
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        const columns = [
          { key: 'id', label: 'ID', filterable: false },
          { key: '__EMPTY_4', label: 'სახელი', filterable: true },
          { key: '__EMPTY_6', label: 'პირადი ნომერი', filterable: true },
          { key: '__EMPTY_3', label: 'სამუშაო ადგილი', filterable: true },
          { key: '__EMPTY_2', label: 'ხელეკრულების ტიპი', filterable: true },
          { key: '__EMPTY_5', label: 'თანამდებობა', filterable: true },
          { key: '__EMPTY_8', label: 'ავანსი', filterable: false },
          { key: '__EMPTY_10', label: 'ხელფასი NET', filterable: false },
          { key: '__EMPTY_12', label: 'დანამატი', filterable: false },
          { key: 'actions', label: 'Actions', filterable: false }
        ];

        // Load available months
        async function loadMonths() {
            try {
                console.log('Token:', getToken());
                const res = await fetch(`${API_URL}/months`);
                console.log('Response status:', res.status, 'ok:', res.ok);
                if (!res.ok) {
                    throw new Error(`Error ${res.status}: ${res.statusText}`);
                }
                const months = await res.json();
                console.log('Months data:', months);

                const select = document.getElementById('monthSelect');
                select.innerHTML = '';

                months.forEach(month => {
                    const option = document.createElement('option');
                    option.value = month;
                    option.textContent = month;
                    select.appendChild(option);
                });

                if (months.length > 0) {
                    select.value = months[months.length - 1]; // Select latest month
                    loadSalaryData(months[months.length - 1]);
                }
            } catch (err) {
                showError('Failed to load months: ' + err.message);
            }
        }

        // Load unique positions for filter
        async function loadPositions() {
            try {
                const res = await fetch(`${API_URL}/positions`);
                const positions = await res.json();

                const select = document.getElementById('positionFilter');
                positions.forEach(pos => {
                    const option = document.createElement('option');
                    option.value = pos;
                    option.textContent = pos;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Failed to load positions:', err);
            }
        }

        // Load salary data for selected month
        async function loadSalaryData(month) {
            try {
                currentMonth = month;
                const content = document.getElementById('content');
                content.innerHTML = '<div class="loading">Loading salary data...</div>';

                const res = await fetch(`${API_URL}/salary/${month}`);
                if (!res.ok) {
                    throw new Error(`Error ${res.status}: ${res.statusText}`);
                }
                const data = await res.json();

                if (!data || data.length === 0) {
                    content.innerHTML = '<div class="error">No salary data found for this month</div>';
                    return;
                }

                originalData = data;
                currentData = data;
                activeFilters = {};
                renderTable(currentData);
                document.getElementById('timestamp').textContent = new Date().toLocaleString();
            } catch (err) {
                showError('Failed to load salary data: ' + err.message);
            }
        }

        // Get unique values for a column
        function getUniqueValues(col) {
            // Special case for contract type column
            if (col === '__EMPTY_2') {
                // Return contract type options based on condition
                const contractTypes = new Set();
                originalData.forEach(emp => {
                    const workLocation = emp['__EMPTY_3'] || '';
                    if (String(workLocation).includes('მომსახურება')) {
                        contractTypes.add('მომსახურება');
                    } else {
                        contractTypes.add('სახელფასო');
                    }
                });
                return Array.from(contractTypes).sort();
            }

            return [...new Set(originalData
                .map(emp => emp[col])
                .filter(Boolean)
            )].sort();
        }

        // Render salary table with column filters
        function renderTable(data) {
            const content = document.getElementById('content');

            let html = '<table><thead><tr>';

            // Header row with filters
            columns.forEach(col => {
                let header = `<th><div style="display: flex; justify-content: space-between; align-items: center;">
                    <span>${col.label}</span>`;

                if (col.filterable) {
                    const uniqueValues = getUniqueValues(col.key);
                    header += `<div style="position: relative; display: inline-block;">
                        <button onclick="toggleFilterDropdown('${col.key}')" style="background: none; border: none; cursor: pointer; font-size: 1.2em;">⬇️</button>
                        <div id="filter-${col.key}" class="filter-dropdown" style="display: none; position: absolute; top: 100%; right: 0; background: white; border: 1px solid #ccc; border-radius: 4px; padding: 5px; z-index: 10; min-width: 150px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                            <button onclick="clearColumnFilter('${col.key}')" style="width: 100%; text-align: left; padding: 8px; background: #f8f9fa; border: none; cursor: pointer; font-weight: 600; margin-bottom: 5px;">Clear</button>`;

                    uniqueValues.forEach(val => {
                        header += `<label style="display: block; padding: 5px; cursor: pointer;">
                            <input type="checkbox" value="${val}" onchange="applyColumnFilter('${col.key}', this.value, this.checked)">
                            ${val}
                        </label>`;
                    });

                    header += `</div></div>`;
                }

                header += `</div></th>`;
                html += header;
            });

            html += '</tr></thead><tbody>';

            // Data rows
            data.forEach((emp, idx) => {
                html += '<tr>';
                columns.forEach((col, cidx) => {
                    let value;
                    if (col.key === 'id') {
                        value = idx + 1;
                    } else if (col.label === 'ხელეკრულების ტიპი') {
                        // Conditional logic: check if work location contains "მომსახურება"
                        const workLocation = emp['__EMPTY_3'] || '';
                        if (String(workLocation).includes('მომსახურება')) {
                            value = 'მომსახურება';
                        } else {
                            value = 'სახელფასო';
                        }
                    } else {
                        value = emp[col.key];
                        // Replace N/A with 0 for numeric columns
                        if (!value || value === 'N/A') {
                            if (col.label === 'ავანსი' || col.label === 'ხელფასი NET' || col.label === 'დანამატი') {
                                value = 0;
                            } else {
                                value = 0;
                            }
                        }
                    }

                    if (col.key === 'actions') {
                        html += `<td style="text-align: center;">
                            <button onclick="deleteEmployee(${idx}, '${emp['__EMPTY_4']}')" style="padding: 8px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">🗑️ Delete</button>
                        </td>`;
                    } else if (col.label === 'ავანსი' || col.label === 'ხელფასი NET' || col.label === 'დანამატი') {
                        const fieldMap = { 'ავანსი': '__EMPTY_8', 'ხელფასი NET': '__EMPTY_10', 'დანამატი': '__EMPTY_12' };
                        html += `<td class="editable" onclick="editCell(this, ${idx}, '${col.label}')">${value}</td>`;
                    } else {
                        html += `<td>${value}</td>`;
                    }
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            content.innerHTML = html;
        }

        function toggleFilterDropdown(colKey) {
            const dropdown = document.getElementById(`filter-${colKey}`);
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        function applyColumnFilter(colKey, value, isChecked) {
            if (!activeFilters[colKey]) {
                activeFilters[colKey] = [];
            }

            if (isChecked) {
                if (!activeFilters[colKey].includes(value)) {
                    activeFilters[colKey].push(value);
                }
            } else {
                activeFilters[colKey] = activeFilters[colKey].filter(v => v !== value);
            }

            applyAllFilters();
        }

        function clearColumnFilter(colKey) {
            activeFilters[colKey] = [];
            applyAllFilters();
            document.getElementById(`filter-${colKey}`).style.display = 'none';
        }

        function applyAllFilters() {
            let filtered = [...originalData];

            Object.keys(activeFilters).forEach(colKey => {
                if (activeFilters[colKey].length > 0) {
                    // Special handling for contract type column
                    if (colKey === '__EMPTY_2') {
                        filtered = filtered.filter(emp => {
                            const workLocation = emp['__EMPTY_3'] || '';
                            const contractType = String(workLocation).includes('მომსახურება') ? 'მომსახურება' : 'სახელფასო';
                            return activeFilters[colKey].includes(contractType);
                        });
                    } else {
                        filtered = filtered.filter(emp =>
                            activeFilters[colKey].includes(emp[colKey])
                        );
                    }
                }
            });

            renderTable(filtered);
        }

        async function deleteEmployee(idx, empName) {
            if (!confirm(`Are you sure you want to delete ${empName}?`)) {
                return;
            }

            try {
                const res = await fetch(`${API_URL}/delete-employee/${currentMonth}/${idx + 1}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    showSuccess('Employee deleted successfully!');
                    loadSalaryData(currentMonth);
                } else {
                    showError('Failed to delete employee');
                }
            } catch (err) {
                showError('Error: ' + err.message);
            }
        }

        function searchAllColumns() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            if (!searchTerm) {
                applyAllFilters();
                return;
            }

            let filtered = [...originalData].filter(emp => {
                return columns.some(col => {
                    const value = String(emp[col.key] || '').toLowerCase();
                    return value.includes(searchTerm);
                });
            });

            renderTable(filtered);
        }

        function populateDropdowns() {
            // Get unique positions
            const positions = [...new Set(originalData
                .map(emp => emp['__EMPTY_5'])
                .filter(Boolean)
            )].sort();

            // Get unique locations
            const locations = [...new Set(originalData
                .map(emp => emp['__EMPTY_3'])
                .filter(Boolean)
            )].sort();

            // Get unique departments
            const departments = [...new Set(originalData
                .map(emp => emp['__EMPTY'])
                .filter(Boolean)
            )].sort();

            // Populate Position dropdown
            const positionSelect = document.getElementById('empPosition');
            positions.forEach(pos => {
                const option = document.createElement('option');
                option.value = pos;
                option.textContent = pos;
                positionSelect.appendChild(option);
            });

            // Populate Location dropdown
            const locationSelect = document.getElementById('empLocation');
            locations.forEach(loc => {
                const option = document.createElement('option');
                option.value = loc;
                option.textContent = loc;
                locationSelect.appendChild(option);
            });

            // Populate Department dropdown
            const deptSelect = document.getElementById('empDepartment');
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                deptSelect.appendChild(option);
            });
        }

        function openAddEmployeeModal() {
            // Clear previous options
            ['empPosition', 'empLocation', 'empDepartment'].forEach(id => {
                const select = document.getElementById(id);
                while (select.options.length > 1) {
                    select.remove(1);
                }
            });

            // Populate dropdowns
            populateDropdowns();

            document.getElementById('addEmployeeModal').style.display = 'flex';
        }

        function closeAddEmployeeModal() {
            document.getElementById('addEmployeeModal').style.display = 'none';
            document.getElementById('addEmployeeForm').reset();
        }

        async function saveNewEmployee(e) {
            e.preventDefault();

            const name = document.getElementById('empName').value.trim();
            const personalId = document.getElementById('empPersonalId').value.trim();
            const position = document.getElementById('empPosition').value.trim();
            const location = document.getElementById('empLocation').value.trim();
            const department = document.getElementById('empDepartment').value.trim();
            const contractType = document.getElementById('empContractType').value.trim();
            const salary = document.getElementById('empSalary').value.trim();

            console.log('Form data:', { name, personalId, position, location, department, contractType, salary });

            // Validation
            if (!name || !personalId || !position || !location || !department || !contractType) {
                showError('Please fill all required fields');
                return;
            }

            // Personal ID must be exactly 11 characters
            if (personalId.length !== 11) {
                showError('Personal ID must be exactly 11 digits');
                return;
            }

            // Salary is optional, but if provided must be valid
            let salaryValue = 0;
            if (salary) {
                salaryValue = parseFloat(salary);
                if (isNaN(salaryValue) || salaryValue < 0) {
                    showError('Salary must be a valid number');
                    return;
                }
            }

            if (!currentMonth) {
                showError('Please select a month first');
                return;
            }

            try {
                console.log('Sending to API:', `${API_URL}/add-employee/${currentMonth}`);

                const res = await fetch(`${API_URL}/add-employee/${currentMonth}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        personalId,
                        position,
                        location,
                        department,
                        contractType,
                        salary: salaryValue
                    })
                });

                console.log('Response status:', res.status);
                const data = await res.json();
                console.log('Response data:', data);

                if (res.ok) {
                    showSuccess('Employee added successfully!');
                    closeAddEmployeeModal();
                    loadSalaryData(currentMonth);
                } else {
                    showError('Failed to add employee: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error:', err);
                showError('Error: ' + err.message);
            }
        }

        // Edit cell functionality
        function editCell(cell, rowIdx, fieldName) {
            if (editingCell) return;

            const currentValue = cell.textContent;
            const input = document.createElement('input');
            input.type = 'number';
            input.value = currentValue;
            input.style.width = '100%';

            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn-save';
            saveBtn.textContent = 'Save';

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-cancel';
            cancelBtn.textContent = 'Cancel';

            cell.innerHTML = '';
            cell.appendChild(input);
            cell.appendChild(saveBtn);
            cell.appendChild(cancelBtn);

            input.focus();
            editingCell = cell;

            saveBtn.onclick = async () => {
                const newValue = parseFloat(input.value);

                // Save to API
                try {
                    const res = await fetch(`${API_URL}/salary/${currentMonth}/${rowIdx + 1}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            [fieldName]: newValue
                        })
                    });

                    if (res.ok) {
                        showSuccess('Data saved successfully!');
                        cell.textContent = newValue;
                        editingCell = null;
                    } else {
                        showError('Failed to save data');
                    }
                } catch (err) {
                    showError('Error: ' + err.message);
                }
            };

            cancelBtn.onclick = () => {
                cell.textContent = currentValue;
                editingCell = null;
            };
        }

        // Show message
        function showMessage(message, type) {
            const div = document.getElementById('message');
            div.textContent = message;
            div.className = type;
            setTimeout(() => {
                div.textContent = '';
                div.className = '';
            }, 3000);
        }

        function showError(msg) {
            showMessage(msg, 'error');
        }

        function showSuccess(msg) {
            showMessage(msg, 'success');
        }

        // Event listeners
        document.getElementById('monthSelect').addEventListener('change', (e) => {
            if (e.target.value) {
                loadSalaryData(e.target.value);
            }
        });

        document.getElementById('clearFilters').addEventListener('click', () => {
            activeFilters = {};
            document.getElementById('searchInput').value = '';
            renderTable(originalData);
        });

        document.getElementById('searchBtn').addEventListener('click', searchAllColumns);

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchAllColumns();
            }
        });

        document.getElementById('addEmployeeForm').addEventListener('submit', saveNewEmployee);

        // Initialize
        loadUserInfo();
        loadMonths();
    </script>
</body>
</html>
